name: JMeter Performance Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  performance-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install JMeter
        run: |
          wget https://dlcdn.apache.org/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz

      - name: Verify test data
        run: |
          echo "Current directory:"
          pwd

          echo "Project files:"
          ls -la

          echo "Test data:"
          ls -la test-data

          test -f test-data/booking-data.csv

      - name: Run JMeter test
        run: |
          mkdir -p results

          ./apache-jmeter-5.6.3/bin/jmeter \
            -n \
            -t test-plans/booking-api-assertions-reporting.jmx \
            -l results/jmeter-results.jtl

          echo "JTL size:"
          ls -lh results/jmeter-results.jtl

          echo "JTL lines:"
          wc -l results/jmeter-results.jtl

      - name: Generate JMeter HTML report
        run: |
          rm -rf results/jmeter-html-report

          ./apache-jmeter-5.6.3/bin/jmeter \
            -g results/jmeter-results.jtl \
            -o results/jmeter-html-report

          echo "HTML report generated:"
          ls -la results/jmeter-html-report

      - name: Upload JMeter HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-html-report
          path: results/jmeter-html-report

      - name: Upload JMeter raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-raw-results
          path: results/jmeter-results.jtl